[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-g-photo-processor"
version = "1.0.0"
description = "Windows desktop photo cropper, panorama splitter and photo expander for Instagram"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=11,<13",
    "pillow-heif>=1,<2",
    "numpy>=2.2,<3",
    "imagecodecs>=2026.10.10",
]

[project.optional-dependencies]
dev = ["PyInstaller>=6.11,<7", "pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1"]

[project.gui-scripts]
insta-g-photo-processor = "insta_g.app:main"

[tool.setuptools.packages.find]
include = ["insta_g*"]

[tool.setuptools.package-data]
insta_g = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
